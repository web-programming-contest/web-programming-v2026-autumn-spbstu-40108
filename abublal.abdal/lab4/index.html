<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4 — Студенты и оценки</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Студенты и оценки</h1>

      <form data-testid="entity-form" class="entity-form">
        <label>
          ID
          <input type="number" name="id" required />
        </label>
        <label>
          Имя
          <input type="text" name="name" required />
        </label>
        <button type="submit">Добавить студента</button>
      </form>

      <section class="grade-section">
        <h2>Добавить оценку</h2>
        <form data-testid="grade-form" class="grade-form">
          <label>
            Студент
            <select name="studentId" required>
              <option value="">— выберите —</option>
            </select>
          </label>
          <label>
            Предмет
            <input type="text" name="subject" required />
          </label>
          <label>
            Оценка
            <input type="number" name="grade" min="1" max="5" required />
          </label>
          <button type="submit">Добавить оценку</button>
        </form>
      </section>

      <section
        data-testid="entity-list"
        aria-label="Список студентов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
