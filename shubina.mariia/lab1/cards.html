<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Карточки товара</title>
  <style>
    .cards {
      display: flex;
      gap: 20px;
    }

    .card {
      padding: 10px;
      border: 1px solid #ccc;
    }

    .card img {
      display: block;
      width: 200px;
      height: 150px;
      padding: 10px;
    }

    .card h3 {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
    }

    .card p {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="cards">

    <div class="card">
      <img src="card_1.png" alt="Носки">
      <h3>Носки</h3>
      <p>Носки теплые шерстяные</p>
    </div>

    <div class="card">
      <img src="card_2.png" alt="Тушь">
      <h3>Тушь</h3>
      <p>Тушь водостойкая 3D эффект</p>
    </div>

    <div class="card">
      <img src="card_3.png" alt="Огурцы">
      <h3>Огурцы</h3>
      <p>Огурцы свежие 500 гр</p>
    </div>

  </div>

</body>
</html>
