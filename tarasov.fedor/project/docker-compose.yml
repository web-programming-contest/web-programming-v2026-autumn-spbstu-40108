services:
  db:
    image: postgres:16-alpine
    container_name: gadget-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gadget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gadget}
      POSTGRES_DB: ${POSTGRES_DB:-gadget_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gadget_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gadget} -d ${POSTGRES_DB:-gadget_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gadget_hub_pgdata:
